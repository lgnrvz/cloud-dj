name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller yt-dlp

      - name: Download ffmpeg (essentials build)
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($ff.FullName)\bin\ffmpeg.exe" .
          Copy-Item "$($ff.FullName)\bin\ffprobe.exe" .

      - name: Download Node.js runtime (needed by yt-dlp for JS challenges)
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.12.0/node-v22.12.0-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node
          $nd = Get-ChildItem node -Directory | Select-Object -First 1
          Copy-Item "$($nd.FullName)\node.exe" .

      - name: Build single-file exe with PyInstaller
        run: |
          $yt = (Get-Command yt-dlp).Source
          pyinstaller --onefile --name cloud-dj --console `
            --version-file "packaging\version_info.txt" `
            --add-binary "$yt;." `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-binary "node.exe;." `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --hidden-import "engineio.async_drivers.threading" `
            --hidden-import "simple_websocket" `
            app.py

      - name: Smoke test (boot exe, add song, verify stream)
        run: |
          $p = Start-Process -FilePath "dist\cloud-dj.exe" -PassThru
          Start-Sleep -Seconds 15
          $base = "http://localhost:5050"
          try {
            $r = Invoke-WebRequest -Uri $base -TimeoutSec 8 -UseBasicParsing
            Write-Host "SMOKE OK: HTTP $($r.StatusCode)"
            if ($r.StatusCode -ne 200 -and $r.StatusCode -ne 302) { exit 1 }

            # Log in as admin (fresh DB seeds admin/djadmin123)
            $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest -Uri "$base/login" -Method Post `
              -Body @{username='admin';password='djadmin123'} `
              -WebSession $s -UseBasicParsing -TimeoutSec 10 | Out-Null

            # Add a real YouTube video (duration check exercises yt-dlp + node).
            # /add 302-redirects to /queue on success - follow it.
            $add = Invoke-WebRequest -Uri "$base/add" -Method Post `
              -Body @{url='https://www.youtube.com/watch?v=dQw4w9WgXcQ'} `
              -WebSession $s -UseBasicParsing -TimeoutSec 60 `
              -ErrorAction SilentlyContinue

            # Probe yt-dlp directly to surface WHY extraction may have failed
            $probe = & yt-dlp --print duration -s "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | Out-String
            Write-Host "YTDLP PROBE: $($probe.Trim().Substring(0, [Math]::Min(200, $probe.Trim().Length)))"

            # Confirm the row actually landed - the app's own API reports queue count
            $np = Invoke-RestMethod -Uri "$base/now-playing" -WebSession $s -TimeoutSec 10
            Write-Host "QUEUE COUNT: $($np.queue_count)"
            if ($np.queue_count -lt 1) { Write-Host "ADD FAIL - no queue row"; exit 1 }

            # Read the first chunk of the stream - proves yt-dlp actually delivers audio
            $cookies = ($s.Cookies.GetCookies($base) | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join "; "
            $client = [System.Net.Http.HttpClient]::new()
            $req = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get, "$base/stream/1")
            $req.Headers.Add("Cookie", $cookies)
            $resp = $client.SendAsync($req, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).Result
            $stream = $resp.ReadAsStreamAsync().Result
            $buf = New-Object byte[] 8192
            $n = 0
            try { $n = $stream.ReadAsync($buf, 0, $buf.Length).Wait(25000) } catch { $n = 0 }
            $ct = $resp.Content.Headers.ContentType.ToString()
            $stream.Dispose(); $client.Dispose()
            Write-Host "STREAM HTTP: $($resp.StatusCode) | TYPE: $ct | BYTES: $n"
            if ($resp.StatusCode -ne 200 -or $ct -notlike "audio/*" -or $n -le 0) {
              Write-Host "STREAM FAIL - no audio data"; exit 1
            }
            Write-Host "STREAM OK - audio flowing"
          } catch {
            Write-Host "SMOKE FAIL: $_"
            exit 1
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-dj-windows
          path: dist/cloud-dj.exe
          retention-days: 30

      - name: Attach exe to release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cloud-dj.exe
