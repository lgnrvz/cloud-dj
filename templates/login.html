{% extends "base.html" %}
{% block title %}Sign in &middot; Cloud-DJ{% endblock %}
{% block content %}
<div class="auth-card card" id="loginCard">
    <h1>Welcome</h1>
    <p>Sign in to request songs and control the queue</p>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <div style="position:relative;">
            <input type="password" name="password" id="passInput" placeholder="Password" required style="padding-right:36px;">
            <span id="eyeToggle" onclick="togglePass()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#555;font-size:1rem;user-select:none;">&#128065;</span>
        </div>
        <button type="submit">Log In</button>
    </form>
    <script>
    function togglePass() {
        const inp = document.getElementById('passInput');
        const eye = document.getElementById('eyeToggle');
        if (inp.type === 'password') {
            inp.type = 'text';
            eye.style.color = '#1db954';
        } else {
            inp.type = 'password';
            eye.style.color = '#555';
        }
    }
    </script>
    <div class="auth-link">
        <a href="#" onclick="showForgotPassword(); return false;">Forgot password?</a>
        &middot;
        <a href="{{ url_for('signup') }}">Sign up here</a>
    </div>
</div>

<!-- Forgot Password Card (hidden by default) -->
<div class="auth-card card" id="forgotCard" style="display:none;">
    <h1>Reset Password</h1>
    <p>Enter the default password and set a new one</p>
    <form id="forgotForm" onsubmit="resetPassword(event)">
        <input type="password" id="defaultPass" placeholder="Default password" required>
        <input type="password" id="newPass" placeholder="New password" required minlength="4">
        <input type="password" id="confirmPass" placeholder="Confirm new password" required minlength="4">
        <div id="forgotMsg" style="font-size:0.75rem;color:#ff4444;margin-bottom:8px;display:none;"></div>
        <button type="submit">Reset Password</button>
    </form>
    <div class="auth-link"><a href="#" onclick="showLogin(); return false;">Back to login</a></div>
</div>

<script>
function showForgotPassword() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('forgotCard').style.display = '';
}
function showLogin() {
    document.getElementById('forgotCard').style.display = 'none';
    document.getElementById('loginCard').style.display = '';
    document.getElementById('forgotMsg').style.display = 'none';
}

function resetPassword(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const msg = document.getElementById('forgotMsg');
    const defaultPass = document.getElementById('defaultPass').value;
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;

    if (!defaultPass || !newPass || !confirmPass) {
        msg.textContent = 'All fields required';
        msg.style.display = '';
        return;
    }
    if (newPass !== confirmPass) {
        msg.textContent = 'New passwords do not match';
        msg.style.display = '';
        return;
    }
    if (newPass.length < 4) {
        msg.textContent = 'Min 4 characters';
        msg.style.display = '';
        return;
    }

    btn.disabled = true;
    btn.textContent = '...';

    fetch('/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            default_password: defaultPass,
            new_password: newPass
        })
    }).then(r => r.json()).then(d => {
        msg.style.display = '';
        if (d.success) {
            msg.style.color = '#1db954';
            msg.textContent = 'Password reset! Redirecting...';
            setTimeout(() => window.location.href = '/queue', 1500);
        } else {
            msg.style.color = '#ff4444';
            msg.textContent = d.error || 'Reset failed';
        }
    }).catch(() => {
        msg.style.display = '';
        msg.style.color = '#ff4444';
        msg.textContent = 'Server error';
    }).finally(() => {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    });
}
</script>
{% endblock %}
